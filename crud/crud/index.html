<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPACE FISH</title>
    <link rel="stylesheet" href="game.css">
</head>
<body>

   <header class="br">
    <h1>SPACE QUACK</h1>
</header>
   
<div class="container">
<form id="from">
    
    <input type="hidden" id="idJogador">

    <h2>REGISTRO DO ASTRONAUTA</h2>
    <p>DIGITE O NOME DO ASTRONAUTA</p>
    <input type="text" placeholder="Seu nome" id="nome" maxlength="20">
    <br>

    <p>DIGITE SEU NICK</p>
    <input type="text" placeholder="Seu nome de usuário: " id="user" maxlength="20">
    <br>

    <p>DIGITE A IDADE</p>
    <input type="number" min="18" max="50" id="idade">
    <br>

    <p>SELECIONE O GÊNERO</p>
    <input type="radio" id="feminino" name="genero" value="Feminino">
    <label for="feminino">Feminino</label><br>

    <input type="radio" id="masculino" name="genero" value="Masculino">
    <label for="masculino">Masculino</label><br>

    <input type="radio" id="neutro" name="genero" value="Neutro">
    <label for="neutro">Gênero Neutro</label>
    <br><br>

<button id="ENVIAR">ENVIAR</button>
<button id="JOGAR">JOGAR</button>
</form> 
<div id="contador" style="margin-top: 15px; font-weight: bold;"></div>
<div id="listaJogadores" style="margin-top: 20px;"></div>

</div>
<script src="jg.js"></script>
    </body>
</html>
