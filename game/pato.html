
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SPACE WALL</title>

    <link rel="stylesheet" href="cenar.css">
    <script src="game.js" defer></script>
</head>

<body>

    <!-- Tela inicial -->
    <div id="game-wrapper">
        <h1 class="container">SPACE WALL</h1>
        <button id="play" type="button">PLAY</button>
    </div>

    <!-- Botão voltar -->
    <button id="Volta" type="button" aria-label="Voltar">
        ᐊ
    </button>

    <!-- Nick e vidas -->
    <header id="jogador-info">
        <span id="jogador-nickname"></span>

        <div id="vidas" aria-label="Três vidas restantes">
            <img class="vida" src="/img%20Jogo/decoration/astrocora%C3%A7%C3%A3o.png" alt="Vida 1">
            <img class="vida" src="/img%20Jogo/decoration/astrocora%C3%A7%C3%A3o.png" alt="Vida 2">
            <img class="vida" src="/img%20Jogo/decoration/astrocora%C3%A7%C3%A3o.png" alt="Vida 3">
        </div>
    </header>

    <!-- Nome e personagem -->
    <main id="personagem-container">
        <h2 id="jogador-nome"></h2>

        <img id="personagem" src="" alt="Astronauta do jogador">
    </main>

    <!-- Área onde os obstáculos se movimentam -->
    <div id="area-obstaculos"></div>

    <!-- Chão lunar -->
    <div id="lua-linha"></div>

    <!-- Tela preta ao perder uma vida -->
    <div id="tela-impacto" aria-hidden="true"></div>

    <!-- Game Over -->
    <section id="game-over" aria-labelledby="game-over-titulo">
        <h2 id="game-over-titulo">GAME OVER</h2>
        <p>Suas vidas acabaram, astronauta!</p>
        <button id="reiniciar" type="button">REINICIAR</button>
    </section>

</body>
</html>
